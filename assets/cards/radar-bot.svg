<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Telegram Radar Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".22"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .shine { animation: shine 5s ease-in-out infinite; }
      @keyframes shine { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="599" height="299" rx="16" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x=".5" y=".5" width="599" height="299" rx="16" fill="url(#glow)"/>
  <rect class="shine" x="28" y="0" width="180" height="3" rx="1.5" fill="url(#bar)"/>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text x="28" y="50" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#22c55e">PYTHON · AUTOMAÇÃO</text>
    <text x="28" y="88" font-size="26" font-weight="800" fill="#f1f5f9">Telegram Radar Bot</text>
    <text x="28" y="124" font-size="14" fill="#94a3b8">Varre vagas de estágio e júnior em</text><text x="28" y="145" font-size="14" fill="#94a3b8">várias fontes, dá nota pela</text><text x="28" y="166" font-size="14" fill="#94a3b8">compatibilidade com o meu perfil e</text><text x="28" y="187" font-size="14" fill="#94a3b8">só avisa o que é novo.</text>
  </g>
  <rect x="28" y="244" width="65" height="24" rx="12" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".35"/><text x="60.5" y="260" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#22c55e">asyncio</text><rect x="101" y="244" width="51" height="24" rx="12" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".35"/><text x="126.5" y="260" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#22c55e">httpx</text><rect x="160" y="244" width="58" height="24" rx="12" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".35"/><text x="189.0" y="260" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#22c55e">SQLite</text><rect x="226" y="244" width="58" height="24" rx="12" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".35"/><text x="255.0" y="260" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11" fill="#22c55e">Docker</text>
  
  <g transform="translate(336 44)" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <rect width="244" height="212" rx="12" fill="#0e1621" stroke="#22c55e" stroke-opacity=".45"/>
    <rect width="244" height="34" rx="12" fill="#17212b"/><rect y="22" width="244" height="12" fill="#17212b"/>
    <circle cx="20" cy="17" r="10" fill="#22c55e"/>
    <text x="36" y="15" font-size="11" font-weight="700" fill="#e2e8f0">Radar Bot</text>
    <text x="36" y="27" font-size="9" fill="#64748b">bot</text>
    <rect x="12" y="46" width="206" height="102" rx="10" fill="#182533"/>
    <text x="22" y="66" font-size="10.5" font-weight="700" fill="#4ade80">● ALTA AFINIDADE · 92%</text>
    <text x="22" y="85" font-size="11" font-weight="600" fill="#e2e8f0">Estágio Backend Python</text>
    <text x="22" y="102" font-size="10" fill="#94a3b8">Acme · Remoto</text>
    <text x="22" y="120" font-size="10" fill="#60a5fa">Python · Docker · SQL</text>
    <text x="22" y="138" font-size="9" fill="#64748b">via backend-br/vagas</text>
    <rect x="12" y="156" width="162" height="46" rx="10" fill="#182533"/>
    <text x="22" y="176" font-size="10.5" font-weight="700" fill="#facc15">● BOA OPORTUNIDADE · 68%</text>
    <text x="22" y="193" font-size="11" fill="#e2e8f0">Dev Júnior React</text>
  </g>
</svg>
